name: Release

on:
  push:
    tags: ["v*"]
  # Dry run from the Actions tab: every step except the GitHub Release; the signed APK
  # and SHA256SUMS are attached to the run instead.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-disabled: true

      # Same memory limits as the check job in android.yml (16 GB runner); the user
      # gradle.properties wins over the project's, so every Gradle call shares one daemon.
      - name: Gradle memory
        run: |
          mkdir -p "${GRADLE_USER_HOME:-$HOME/.gradle}"
          printf '%s\n' \
            'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' \
            'kotlin.compiler.execution.strategy=in-process' \
            >> "${GRADLE_USER_HOME:-$HOME/.gradle}/gradle.properties"

      - name: Tag matches versionName, changelog exists
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          code=$(sed -n 's/^ *versionCode = \([0-9]*\)/\1/p' app/build.gradle.kts)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, versionName $version"; exit 1; }
          fi
          notes="fastlane/metadata/android/en-US/changelogs/$code.txt"
          test -s "$notes" || { echo "missing $notes"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "NOTES=$notes" >> "$GITHUB_ENV"

      - name: Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # First build in the fresh checkout: F-Droid compares this APK with its own clean build.
      - name: Signed APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew --no-build-cache :app:assembleRelease
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/retroplayer-$VERSION.apk"

      # Inputs that decide whether a local or F-Droid build matches this APK byte for byte.
      - name: Build environment
        run: |
          mkdir build-env
          cp app/build/outputs/mapping/release/mapping.txt build-env/
          {
            java -version 2>&1
            grep -h Pkg.Revision "$ANDROID_HOME"/platforms/android-37*/source.properties
            sha256sum "$ANDROID_HOME"/platforms/android-37*/android.jar
            ls "$ANDROID_HOME"/ndk 2>/dev/null || echo "no NDK"
          } | tee build-env/environment.txt

      - name: Build environment output
        uses: actions/upload-artifact@v7
        with:
          name: build-environment
          path: build-env/

      # After the APK build, so the cache cannot influence the published APK.
      - name: Robolectric Android jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml', '**/src/test/resources/robolectric.properties') }}

      - name: Tests, lint, privacy
        run: ./gradlew check

      - name: Signature and checksums
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "dist/retroplayer-$VERSION.apk"
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Retro Player $VERSION" --notes-file "$NOTES"

      - name: Dry run output
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: release-dry-run
          path: dist/

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
