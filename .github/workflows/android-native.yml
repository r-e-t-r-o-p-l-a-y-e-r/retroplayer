name: Android native

on:
  push:
    branches: [main, master]
    paths: ["android-native/**", "lib/l10n/**", ".github/workflows/android-native.yml"]
  pull_request:
    paths: ["android-native/**", "lib/l10n/**", ".github/workflows/android-native.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-native
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Strings are in sync with lib/l10n
        run: python3 scripts/test_arb_to_android.py && python3 scripts/arb_to_android.py --check

      - name: Unit, Robolectric and screenshot tests, lint, privacy
        run: ./gradlew check assembleRelease

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: test-reports
          path: android-native/**/build/reports/

  devices:
    runs-on: ubuntu-latest
    needs: check
    defaults:
      run:
        working-directory: android-native
    steps:
      - uses: actions/checkout@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Instrumented tests on managed phones
        run: ./gradlew phonesGroupDebugAndroidTest -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
