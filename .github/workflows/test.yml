name: Test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.8"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Stamp build info
        run: dart run scripts/stamp_build_info.dart

      - name: Check dependency health
        run: flutter pub outdated --no-dev-dependencies --no-transitive || true

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Legacy naming gate
        run: ./scripts/check-no-legacy-names.sh

      - name: Install Linux playback dependencies
        run: |
          sudo apt-get update
          # Ubuntu 24.04+ ships libmpv2; 22.04 used libmpv1.
          if apt-cache show libmpv2 >/dev/null 2>&1; then
            sudo apt-get install -y libmpv2 libmpv-dev
          else
            sudo apt-get install -y libmpv1 libmpv-dev
          fi
          sudo apt-get install -y pulseaudio pulseaudio-utils alsa-utils libasound2-plugins

      - name: Start virtual audio for headless MPV tests
        run: ./scripts/ci-start-virtual-audio.sh

      - name: Run tests
        run: flutter test --coverage

      - name: Run Linux MPV lifecycle integration tests
        run: flutter test test/integration/linux_playback_lifecycle_test.dart

      - name: Run persistence restart integration tests
        run: flutter test test/integration/persistence_restart_test.dart

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.8"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Stamp build info
        run: dart run scripts/stamp_build_info.dart

      - name: Accept Android SDK licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Build debug APK
        run: flutter build apk --debug
