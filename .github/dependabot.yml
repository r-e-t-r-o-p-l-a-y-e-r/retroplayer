version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # From v6 on, its caching is a closed-source component with separate terms of use.
      - dependency-name: gradle/actions
        versions: [">= 6"]
