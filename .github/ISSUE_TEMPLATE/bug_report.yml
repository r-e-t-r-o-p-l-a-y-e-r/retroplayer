name: Bug report
description: Something broken or wrong in Retro Player
labels: ["bug"]
body:
  - type: dropdown
    id: source
    attributes:
      label: Installed from
      options:
        - F-Droid
        - GitHub release
        - Built from source
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: "Pixel 8, Android 16"
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings → About, or release tag
      placeholder: "0.9.0"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: What did you do before the problem appeared?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
