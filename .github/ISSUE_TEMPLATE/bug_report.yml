name: Bug report
description: Something broken or wrong in Retro Player
labels: ["bug"]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - Linux
        - iOS
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings → About, or release tag
      placeholder: "1.0.0+1"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: What did you do before the problem appeared?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
