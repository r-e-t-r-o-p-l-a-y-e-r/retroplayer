org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP built-in Kotlin (Flutter 3.47+); app module does not apply kotlin-android.
android.builtInKotlin=true
# AGP 9.x embeds Kotlin 2.2.10; Flutter's KGP checker still requires >= 2.2.20 until
# it accounts for built-in Kotlin (see flutter build without this property). Remove when upstream fixes.
skipDependencyChecks=true
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
